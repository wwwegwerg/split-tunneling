name: Check generator

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked python -m unittest discover -s tests -v
      - name: Install Mihomo
        run: bash scripts/install-mihomo.sh
      - name: Check exports in Mihomo
        run: uv run --locked python tests/build_fixture.py
