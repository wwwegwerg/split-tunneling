name: Update rules

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "rulesets/**"
      - "config/**"
      - "SOURCES.md"
      - "third-party-notices.txt"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: publish-rules
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - name: Build rules
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: uv run --locked python -m rulesets
      - name: Install Mihomo
        run: bash scripts/install-mihomo.sh
      - name: Compile IP rule sets
        run: uv run --locked python scripts/compile_mihomo.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python scripts/publish.py

  cleanup:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Remove previous releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prune_releases.py
