[project]
name = "split-tunneling"
version = "0.1.0"
description = "Routing lists for Mihomo, Shadowrocket and AmneziaVPN"
requires-python = ">=3.13"
dependencies = ["maxminddb>=3.2,<4"]

[dependency-groups]
dev = ["mypy>=1.18,<2", "ruff>=0.14,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["rulesets", "scripts"]
